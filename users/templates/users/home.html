{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks · Elodi</title>

  <link rel="icon" type="image/png" href="{% static 'logo.png' %}?v=2">
  <link rel="shortcut icon" type="image/png" href="{% static 'logo.png' %}?v=2">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:#1B4A3A;
      --muted:#4D7366;
      --accent:#2B8C69;
      --accent-dark:#1F7A5A;
      --danger:#B3265A;
      --serif:'Fraunces',Georgia,serif;
    }

    * { box-sizing: border-box; }

    body {
      margin:0;
      min-height:100vh;
      padding:24px 16px;
      color:var(--ink);
      overflow-x:hidden;
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      background:linear-gradient(135deg,#D9F2E3 0%,#BCE6D3 45%,#A8DAD6 100%);
    }

    .blob {
      position:fixed;
      border-radius:50%;
      filter:blur(70px);
      opacity:.75;
      pointer-events:none;
      z-index:0;
    }

    .b1 { width:420px; height:420px; background:#7ED9A8; top:-120px; left:-100px; }
    .b2 { width:480px; height:480px; background:#5FB7B8; bottom:-160px; right:-120px; }
    .b3 { width:320px; height:320px; background:#E6F5B8; top:35%; left:40%; opacity:.6; }

    .glass {
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      border-radius:32px;
      background:rgba(255,255,255,.38);
      border:1px solid rgba(255,255,255,.75);
      -webkit-backdrop-filter:blur(24px) saturate(140%);
      backdrop-filter:blur(24px) saturate(140%);
      box-shadow:0 24px 70px rgba(27,74,58,.18);
    }

    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
      .glass { background:rgba(244,252,248,.92); }
    }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 28px;
      border-bottom:1px solid rgba(255,255,255,.65);
    }

    .logo {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo img {
      width:65px;
      height:65px;
      object-fit:contain;
    }

    .logo span {
      font:700 1.6rem/1 var(--serif);
    }

    .who {
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:600;
    }

    .icon-btn {
      border:0;
      width:40px;
      height:40px;
      border-radius:12px;
      background:rgba(255,255,255,.65);
      color:var(--ink);
      transition:.2s;
    }

    .icon-btn:hover { background:#fff; }
    .icon-btn.sm { width:34px; height:34px; background:none; color:var(--muted); }
    .icon-btn.sm:hover { background:rgba(179,38,90,.1); color:var(--danger); }
    .icon-btn.focus-target { color:var(--accent); background:rgba(43,140,105,.1); }
    .icon-btn.focus-target:hover { background:var(--accent); color:#fff; }
    .icon-btn.focus-target.active { background:var(--accent); color:#fff; box-shadow:0 0 0 3px rgba(43,140,105,.3); }

    /* Admin Panel bağlantısı */
    .admin-link {
      display:flex;
      align-items:center;
      gap:7px;
      padding:9px 13px;
      border-radius:12px;
      background:rgba(43,140,105,.12);
      color:var(--accent-dark);
      text-decoration:none;
      font-size:.85rem;
      font-weight:700;
      transition:.2s;
      white-space:nowrap;
    }

    .admin-link:hover {
      background:var(--accent);
      color:#fff;
    }

    .layout {
      display:grid;
      grid-template-columns:250px 1fr;
      gap:28px;
      padding:24px 28px 32px;
    }

    .layout > * { min-width:0; }

    .side h2 {
      font-size:.78rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0 0 8px 12px;
    }

    .side nav {
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .cat {
      display:flex;
      align-items:center;
      gap:10px;
      border:0;
      background:none;
      text-align:left;
      padding:10px 12px;
      border-radius:12px;
      color:var(--ink);
      font:600 .92rem inherit;
      font-family:inherit;
    }

    .cat:hover { background:rgba(255,255,255,.5); }
    .cat.on { background:#fff; box-shadow:0 2px 10px rgba(27,74,58,.1); }
    .cat .n { margin-left:auto; color:var(--muted); font-weight:500; font-size:.8rem; }

    .dot {
      width:10px;
      height:10px;
      border-radius:50%;
      flex:none;
      display:inline-block;
    }

    .newcat {
      display:flex;
      gap:6px;
      margin-top:14px;
    }

    .pomodoro-card {
      margin-top:20px;
      background:rgba(255,255,255,.45);
      border-radius:16px;
      padding:14px;
      text-align:center;
      border:1px solid rgba(255,255,255,.6);
    }

    .pomo-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:6px;
    }

    .pomodoro-card h3 {
      font-size:.78rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0;
      font-weight:700;
    }

    .pomo-stats {
      font-size:.75rem;
      color:var(--accent-dark);
      font-weight:700;
      background:rgba(43,140,105,.12);
      padding:2px 8px;
      border-radius:99px;
    }

    .pomo-active-task {
      font-size:.8rem;
      color:var(--accent-dark);
      margin-bottom:6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:600;
      font-style:italic;
    }

    .pomo-time-select {
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .pomo-time-select span {
      font-size:.76rem;
      color:var(--muted);
      font-weight:600;
    }

    .pomo-time-select input {
      width:65px;
      height:32px;
      text-align:center;
      padding:0;
      font-size:.85rem;
    }

    .pomo-timer {
      font-family:var(--serif);
      font-size:1.8rem;
      font-weight:700;
      color:var(--ink);
      margin-bottom:10px;
    }

    .pomo-btns {
      display:flex;
      gap:6px;
      justify-content:center;
    }

    .pomo-btn {
      border:0;
      padding:6px 12px;
      border-radius:10px;
      font-weight:600;
      font-size:.8rem;
      cursor:pointer;
      transition:.2s;
    }

    .pomo-btn.start { background:var(--accent); color:#fff; }
    .pomo-btn.start:hover { background:var(--accent-dark); }
    .pomo-btn.reset { background:rgba(255,255,255,.7); color:var(--ink); }
    .pomo-btn.reset:hover { background:#fff; }

    input, select {
      height:44px;
      padding:0 14px;
      border-radius:12px;
      font:inherit;
      font-size:.92rem;
      color:var(--ink);
      background:rgba(255,255,255,.7);
      border:1.5px solid rgba(255,255,255,.95);
      transition:.2s;
      min-width:0;
    }

    input::placeholder { color:#7C9A8F; }

    input:focus, select:focus {
      outline:0;
      background:#fff;
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(43,140,105,.18);
    }

    button:focus-visible {
      outline:3px solid var(--accent);
      outline-offset:2px;
    }

    .btn-go {
      height:44px;
      padding:0 22px;
      border:0;
      border-radius:12px;
      color:#fff;
      font-weight:700;
      white-space:nowrap;
      background:linear-gradient(135deg,var(--accent),var(--accent-dark));
      box-shadow:0 6px 16px rgba(31,122,90,.28);
      transition:.2s;
    }

    .btn-go:hover { transform:translateY(-1px); }
    .btn-go.sq { padding:0; width:44px; flex:none; }

    h1 {
      font:700 1.7rem/1.2 var(--serif);
      margin:0 0 10px;
    }

    .prog {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
      color:var(--muted);
      font-size:.9rem;
      font-weight:500;
    }

    .track {
      flex:1;
      height:8px;
      border-radius:99px;
      background:rgba(255,255,255,.7);
      overflow:hidden;
    }

    #bar {
      height:100%;
      width:0;
      border-radius:99px;
      background:linear-gradient(90deg,#7ED9A8,var(--accent));
      transition:width .4s;
    }

    .add {
      background:rgba(255,255,255,.5);
      border-radius:20px;
      padding:14px;
      margin-bottom:16px;
    }

    .add > input { width:100%; margin-bottom:10px; }

    .opts {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .opts select, .opts input { flex:1 1 130px; }
    .opts .btn-go { flex:0 0 auto; }

    .tabs {
      display:flex;
      gap:6px;
      margin-bottom:12px;
    }

    .tab {
      border:0;
      background:none;
      padding:7px 14px;
      border-radius:99px;
      font:600 .86rem inherit;
      font-family:inherit;
      color:var(--muted);
    }

    .tab.on {
      background:#fff;
      color:var(--ink);
      box-shadow:0 2px 8px rgba(27,74,58,.1);
    }

    ul {
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .todo {
      display:flex;
      align-items:center;
      gap:14px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.62);
      transition:.2s;
    }

    .todo:hover { background:rgba(255,255,255,.85); }

    .chk {
      width:28px;
      height:28px;
      flex:none;
      border-radius:50%;
      border:2px solid var(--accent);
      background:none;
      color:#fff;
      display:grid;
      place-items:center;
      font-size:.95rem;
      padding:0;
    }

    .done .chk { background:var(--accent); }

    .info { flex:1; min-width:0; }

    .title {
      display:block;
      font-weight:600;
      overflow-wrap:anywhere;
    }

    .done .title {
      text-decoration:line-through;
      color:var(--muted);
      font-weight:500;
    }

    .meta {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:5px;
    }

    .chip {
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:.76rem;
      font-weight:600;
      padding:2px 10px;
      border-radius:99px;
      background:rgba(27,74,58,.07);
      color:var(--muted);
    }

    .chip.p1 { background:#DDF4E6; color:#1F6A48; }
    .chip.p2 { background:#FBF0C9; color:#7A5A00; }
    .chip.p3 { background:#FADDE5; color:#9B2147; }
    .chip.late { background:#FADDE5; color:#9B2147; }
    .chip.focus-time { background:rgba(43,140,105,.12); color:var(--accent-dark); font-weight:700; }

    .empty {
      text-align:center;
      padding:36px 12px;
      color:var(--muted);
    }

    #toast {
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translate(-50%,20px);
      opacity:0;
      pointer-events:none;
      z-index:5;
      background:var(--ink);
      color:#fff;
      padding:10px 18px;
      border-radius:99px;
      font-weight:600;
      font-size:.9rem;
      transition:.3s;
    }

    #toast.show {
      opacity:1;
      transform:translate(-50%,0);
    }

    .brand-credit {
      position:fixed;
      right:18px;
      bottom:12px;
      color:rgba(255,255,255,.85);
      font-size:.72rem;
      font-weight:600;
      letter-spacing:.04em;
      z-index:2;
      pointer-events:none;
    }

    @media (max-width:820px) {
      .top { padding:14px 18px; }
      .layout { grid-template-columns:1fr; gap:16px; padding:18px 18px 26px; }
      .side h2 { display:none; }
      .side nav { flex-direction:row; overflow-x:auto; padding-bottom:4px; }
      .cat { white-space:nowrap; flex:none; background:rgba(255,255,255,.5); }
      .newcat { margin-top:10px; }
      #hello { display:none; }
    }

    @media (prefers-reduced-motion:reduce) {
      * { transition:none !important; }
    }
  </style>
</head>

<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<main class="glass">
  <header class="top">
    <div class="logo">
      <img src="{% static 'logo.png' %}" alt="Elodi">
      <span>Elodi</span>
    </div>

    <div class="who">
      <span id="hello"></span>

      <!-- Sadece admin kullanıcılar görebilir -->
      <a href="/dashboard/" class="admin-link d-none" id="adminPanel">
        <i class="bi bi-speedometer2"></i>
        Admin Panel
      </a>

      <button class="icon-btn" id="logout" type="button" aria-label="Log out">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <h2>Categories</h2>
      <nav id="cats" aria-label="Categories"></nav>

      <form class="newcat" id="catForm">
        <input id="cName" placeholder="New category" aria-label="New category name" maxlength="50" style="flex:1">
        <button class="btn-go sq" type="submit" aria-label="Add category">
          <i class="bi bi-plus-lg"></i>
        </button>
      </form>

      <div class="pomodoro-card">
        <div class="pomo-header">
          <h3>Focus Timer</h3>
          <div class="pomo-stats" id="pomoTotalToday">0m today</div>
        </div>

        <div class="pomo-active-task" id="pomoActiveTask">No task selected</div>

        <div class="pomo-time-select">
          <span>Minutes:</span>
          <input type="number" id="pomoCustomMin" value="25" min="1" max="180" aria-label="Focus minutes">
        </div>

        <div class="pomo-timer" id="pomoTimer">25:00</div>

        <div class="pomo-btns">
          <button class="pomo-btn start" id="pomoToggle" type="button">Start</button>
          <button class="pomo-btn reset" id="pomoReset" type="button">Reset</button>
        </div>
      </div>
    </aside>

    <section>
      <h1>My Tasks</h1>

      <div class="prog">
        <span id="progText">Loading…</span>
        <div class="track"><div id="bar"></div></div>
      </div>

      <form class="add" id="addForm">
        <input id="fTitle" placeholder="Add a new task…" aria-label="Task title" maxlength="200">

        <div class="opts">
          <select id="fCat" aria-label="Category"></select>

          <select id="fPri" aria-label="Priority">
            <option value="1">Low</option>
            <option value="2" selected>Medium</option>
            <option value="3">High</option>
          </select>

          <input id="fDue" type="datetime-local" aria-label="Due date">
          <button class="btn-go" type="submit">Add</button>
        </div>
      </form>

      <div class="tabs">
        <button class="tab on" data-tab="open" type="button">Open</button>
        <button class="tab" data-tab="done" type="button">Completed</button>
        <button class="tab" data-tab="all" type="button">All</button>
      </div>

      <ul id="list"></ul>
    </section>
  </div>
</main>

<footer class="brand-credit">by Elodea</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = id => document.getElementById(id);

  const el = (tag, cls = '', text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  const state = { todos: [], cats: [], cat: 'all', tab: 'open' };
  const RENKLER = ['#5FB7B8', '#7ED9A8', '#E6C35C', '#E8718D', '#9B8FE0', '#F29E6B'];
  const ONCELIK = { 1: 'Low', 2: 'Medium', 3: 'High' };
  const liste = d => Array.isArray(d) ? d : (d.results || []);

  function girisSayfasi() {
    ['elodi_access', 'elodi_refresh', 'elodi_user'].forEach(k => localStorage.removeItem(k));
    location.replace('/login/');
  }

  async function yenile() {
    const refresh = localStorage.getItem('elodi_refresh');
    if (!refresh) return false;

    try {
      const r = await fetch('/api/auth/token/refresh/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh })
      });

      if (!r.ok) return false;

      const d = await r.json();
      localStorage.setItem('elodi_access', d.access);
      if (d.refresh) localStorage.setItem('elodi_refresh', d.refresh);
      return true;
    } catch {
      return false;
    }
  }

  async function api(yol, { method = 'GET', body } = {}, tekrar = true) {
    const res = await fetch('/api' + yol, {
      method,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + localStorage.getItem('elodi_access')
      },
      body: body ? JSON.stringify(body) : undefined
    });

    if (res.status === 401 && tekrar) {
      if (await yenile()) return api(yol, { method, body }, false);
      girisSayfasi();
    }

    return res;
  }

  let tm;

  function bildir(mesaj) {
    const t = $('toast');
    t.textContent = mesaj;
    t.classList.add('show');
    clearTimeout(tm);
    tm = setTimeout(() => t.classList.remove('show'), 3500);
  }

  function ilkHata(d) {
    const v = Object.values(d)[0];
    return (Array.isArray(v) ? v[0] : v) || 'An error occurred.';
  }

  const tarih = iso => new Date(iso).toLocaleString('en-US', {
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });

  function ciz() {
    kategorileriCiz();
    gorevleriCiz();
  }

  function kategorileriCiz() {
    const acik = t => !t.completed_at;

    const ogeler = [
      {
        id: 'all',
        name: 'All Tasks',
        color: '#2B8C69',
        n: state.todos.filter(acik).length
      },
      ...state.cats.map(c => ({
        id: c.id,
        name: c.name,
        color: c.color,
        n: state.todos.filter(t => acik(t) && t.category === c.id).length
      })),
      {
        id: 'none',
        name: 'Uncategorized',
        color: '#9DB8AE',
        n: state.todos.filter(t => acik(t) && !t.category).length
      },
    ];

    const nav = $('cats');
    nav.innerHTML = '';

    ogeler.forEach(o => {
      const b = el('button', 'cat' + (state.cat === o.id ? ' on' : ''));
      b.type = 'button';

      const d = el('span', 'dot');
      d.style.background = o.color;

      b.append(d, el('span', '', o.name), el('span', 'n', o.n));
      b.onclick = () => {
        state.cat = o.id;
        ciz();
      };

      nav.append(b);
    });

    const sel = $('fCat');
    const onceki = sel.value;
    sel.innerHTML = '';

    sel.append(
      new Option('Uncategorized', ''),
      ...state.cats.map(c => new Option(c.name, c.id))
    );

    sel.value = (state.cat !== 'all' && state.cat !== 'none') ? state.cat : onceki;
  }

  function gorevleriCiz() {
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('on', b.dataset.tab === state.tab);
    });

    const secili = state.todos.filter(t =>
      state.cat === 'all' ||
      (state.cat === 'none' ? !t.category : t.category === state.cat)
    );

    const bitti = secili.filter(t => t.completed_at).length;

    $('progText').textContent = secili.length
      ? bitti + ' / ' + secili.length + ' tasks completed'
      : 'No tasks yet';

    $('bar').style.width = secili.length
      ? (bitti / secili.length * 100) + '%'
      : '0%';

    const gorunen = secili.filter(t =>
      state.tab === 'all' ||
      (state.tab === 'done' ? t.completed_at : !t.completed_at)
    );

    gorunen.sort((a, b) => !!a.completed_at - !!b.completed_at);

    const ul = $('list');
    ul.innerHTML = '';

    if (!gorunen.length) {
      const li = el('li', 'empty');
      li.append(el('p', 'mb-0 mt-2',
        state.tab === 'done'
          ? 'No completed tasks yet.'
          : 'This place is empty. Add your first task above!'
      ));
      ul.append(li);
      return;
    }

    gorunen.forEach(t => ul.append(gorevOgesi(t)));
  }

  let activeFocusTask = null;

function gorevOgesi(t) {
  const bitti = !!t.completed_at;
  const li = el('li', 'todo' + (bitti ? ' done' : ''));

  const chk = el('button', 'chk');
  chk.type = 'button';
  chk.setAttribute('aria-label', bitti ? 'Reopen' : 'Mark as complete');
  chk.innerHTML = bitti ? '<i class="bi bi-check-lg"></i>' : '';
  chk.onclick = () => durumDegistir(t, bitti);

  const info = el('div', 'info');
  const meta = el('div', 'meta');

  info.append(el('span', 'title', t.title));

  // Öncelik
  meta.append(
    el('span', 'chip p' + t.priority, ONCELIK[t.priority])
  );

  // Kategori
  const c = state.cats.find(k => k.id === t.category);

  if (c) {
    const ch = el('span', 'chip');
    const d = el('span', 'dot');
    d.style.background = c.color;
    ch.append(d, c.name);
    meta.append(ch);
  }

  // Son tarih
  if (t.due_at) {
    const gecikti = !bitti && new Date(t.due_at) < new Date();
    const du = el('span', 'chip' + (gecikti ? ' late' : ''));

    du.innerHTML = '<i class="bi bi-clock"></i>';
    du.append(tarih(t.due_at));
    meta.append(du);
  }

  // Görevin toplam odaklanma süresi
  const taskMinutes = Number(t.total_focus_minutes) || 0;

  const focusChip = el('span', 'chip focus-time');
  focusChip.innerHTML =
    `<i class="bi bi-stopwatch"></i> ${taskMinutes}m focused`;

  meta.append(focusChip);

  info.append(meta);

  // Pomodoro görev seçme butonu
  const focusBtn = el(
    'button',
    'icon-btn sm focus-target' +
    (activeFocusTask?.id === t.id ? ' active' : '')
  );

  focusBtn.type = 'button';
  focusBtn.setAttribute('title', 'Focus on this task');
  focusBtn.setAttribute('aria-label', 'Focus on this task');
  focusBtn.innerHTML = '<i class="bi bi-play-circle"></i>';
  focusBtn.onclick = () => gorevSecForFocus(t, focusBtn);

  // Silme butonu
  const sil = el('button', 'icon-btn sm');
  sil.type = 'button';
  sil.setAttribute('aria-label', 'Delete task');
  sil.innerHTML = '<i class="bi bi-trash3"></i>';
  sil.onclick = () => gorevSil(t);

  li.append(chk, info, focusBtn, sil);

  return li;
}

  async function durumDegistir(t, bitti) {
    const r = await api(
      '/todos/' + t.id + '/' + (bitti ? 'reopen' : 'complete') + '/',
      { method: 'POST' }
    );

    if (!r.ok) return bildir('Action failed.');

    Object.assign(t, await r.json());
    ciz();
  }

  async function gorevSil(t) {
    if (!confirm('Delete this task?')) return;

    const r = await api('/todos/' + t.id + '/', { method: 'DELETE' });

    if (!r.ok) return bildir('Could not delete.');

    if (activeFocusTask === t) {
      activeFocusTask = null;
      $('pomoActiveTask').textContent = 'No task selected';
    }

    state.todos = state.todos.filter(x => x !== t);
    ciz();
  }

  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();

    const baslik = $('fTitle').value.trim();
    if (!baslik) return $('fTitle').focus();

    const body = {
      title: baslik,
      priority: +$('fPri').value,
      category: $('fCat').value || null,
      due_at: $('fDue').value
        ? new Date($('fDue').value).toISOString()
        : null
    };

    const r = await api('/todos/', { method: 'POST', body });
    const d = await r.json().catch(() => ({}));

    if (!r.ok) return bildir(ilkHata(d));

    state.todos.unshift(d);

    if (state.tab === 'done') state.tab = 'open';

    $('fTitle').value = '';
    $('fDue').value = '';
    ciz();
    $('fTitle').focus();
  });

  $('catForm').addEventListener('submit', async e => {
    e.preventDefault();

    const ad = $('cName').value.trim();
    if (!ad) return;

    const r = await api('/categories/', {
      method: 'POST',
      body: {
        name: ad,
        color: RENKLER[state.cats.length % RENKLER.length]
      }
    });

    const d = await r.json().catch(() => ({}));

    if (!r.ok) return bildir(ilkHata(d));

    state.cats.push(d);
    $('cName').value = '';
    ciz();
  });

  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => {
      state.tab = b.dataset.tab;
      gorevleriCiz();
    });
  });

  $('logout').addEventListener('click', async () => {
    try {
      await api(
        '/auth/logout/',
        {
          method: 'POST',
          body: { refresh: localStorage.getItem('elodi_refresh') }
        },
        false
      );
    } catch {}

    girisSayfasi();
  });

  // ---------- Pomodoro Timer ----------

  // ---------- Sound: the "ni-ni-nii" alert ----------
  let audioCtx = null;

  // Browsers only allow sound after the user clicks something.
  // So we "unlock" audio when Start/Resume is pressed (see toggleBtn below).
  function sesHazirla() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      console.warn('Audio is not available:', e);
    }
  }

  // Three rising notes that fade out softly
  function sesCal() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const notes = [880, 1108.73, 1318.51];   // A5, C#6, E6
    notes.forEach((freq, i) => {
      const t = audioCtx.currentTime + i * 0.18;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);   // quick fade in
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);  // slow fade out

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.55);
    });
  }

  // ---------- Timer ----------
  const minInput = $('pomoCustomMin');
  let pomoSec = parseInt(minInput.value || 25) * 60;   // seconds left
  let pomoTimerId = null;
  let pomoRunning = false;
  let pomoPaused = false;
  let pomoEnd = 0;                                     // time (ms) when the timer should finish

  const timerEl = $('pomoTimer');
  const toggleBtn = $('pomoToggle');
  const resetBtn = $('pomoReset');
  const totalTodayEl = $('pomoTotalToday');
  const activeTaskEl = $('pomoActiveTask');

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  minInput.addEventListener('change', () => {
    if (!pomoRunning && !pomoPaused) {
      let m = parseInt(minInput.value);

      if (isNaN(m) || m < 1) m = 25;
      if (m > 180) m = 180;

      minInput.value = m;
      pomoSec = m * 60;
      timerEl.textContent = formatTime(pomoSec);
    }
  });

  function gorevSecForFocus(t, btn) {
    activeFocusTask = t;
    activeTaskEl.textContent = 'Focusing: ' + t.title;

    document.querySelectorAll('.focus-target').forEach(b => {
      b.classList.remove('active');
    });

    btn.classList.add('active');
    bildir('Task attached to timer: ' + t.title);
  }

  async function gunlukOdakYukle() {
    try {
      const r = await api('/pomodoro/save/');

      if (!r.ok) return;

      const d = await r.json();

      totalTodayEl.textContent =
        (d.formatted_duration
          ? d.formatted_duration.replace(' dk', 'm').replace(' dakika', 'm')
          : `${d.total_minutes || 0}m`) + ' today';

    } catch (error) {
      console.error('Daily focus time could not be loaded:', error);
    }
  }

  // Runs every 250 ms. It reads the real clock, so the time stays correct
  // even if the browser slows the page down in a background tab.
  function tick() {
    pomoSec = Math.max(0, Math.round((pomoEnd - Date.now()) / 1000));
    timerEl.textContent = formatTime(pomoSec);
    if (pomoSec <= 0) pomodoroBitti();
  }

  async function pomodoroBitti() {
  clearInterval(pomoTimerId);

  pomoRunning = false;
  pomoPaused = false;

  toggleBtn.textContent = 'Start';
  minInput.disabled = false;

  sesCal();

  const completedMinutes = parseInt(minInput.value || 25);

  bildir(`Congratulations! ${completedMinutes}m focus session completed.`);

  try {
    const payload = {
      minutes: completedMinutes
    };

    if (activeFocusTask) {
      payload.task_id = activeFocusTask.id;
    }

    const r = await api('/pomodoro/save/', {
      method: 'POST',
      body: payload
    });

    const d = await r.json();

    if (!r.ok) {
      bildir('Session finished but could not be saved.');
      return;
    }

    // Günlük toplam süreyi güncelle
    await gunlukOdakYukle();

    // Görev süresini sunucudan gelen değerle güncelle
    if (activeFocusTask && d.task_total_minutes !== undefined) {
      const gorev = state.todos.find(
        t => t.id === activeFocusTask.id
      );

      if (gorev) {
        gorev.total_focus_minutes = d.task_total_minutes;
      }
    }

    // Görev listesini yenile
    ciz();

  } catch (error) {
    console.error('Pomodoro save error:', error);
    bildir('Session finished but could not be saved.');
  }

  pomoSec = completedMinutes * 60;
  timerEl.textContent = formatTime(pomoSec);
}
  toggleBtn.addEventListener('click', () => {
    sesHazirla();   // unlock sound: this click is what lets the browser play it later

    if (pomoRunning) {                       // Pause
      clearInterval(pomoTimerId);
      pomoRunning = false;
      pomoPaused = true;
      toggleBtn.textContent = 'Resume';
      return;
    }

    if (!pomoPaused) {                       // Start from the full time
      let m = parseInt(minInput.value);

      if (isNaN(m) || m < 1) m = 25;
      if (m > 180) m = 180;

      minInput.value = m;
      pomoSec = m * 60;
    }                                        // (Resume keeps the seconds that were left)

    pomoPaused = false;
    pomoRunning = true;
    toggleBtn.textContent = 'Pause';
    minInput.disabled = true;

    pomoEnd = Date.now() + pomoSec * 1000;
    pomoTimerId = setInterval(tick, 250);
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(pomoTimerId);
    pomoRunning = false;
    pomoPaused = false;
    minInput.disabled = false;

    const m = parseInt(minInput.value || 25);
    pomoSec = m * 60;

    timerEl.textContent = formatTime(pomoSec);
    toggleBtn.textContent = 'Start';
  });

  // When you come back to the tab, update the timer right away
  document.addEventListener('visibilitychange', () => {
    if (pomoRunning) tick();
  });

  async function yukle() {
    const [me, kat, gor] = await Promise.all([
      api('/auth/me/'),
      api('/categories/'),
      api('/todos/')
    ]);

    if (!me.ok || !kat.ok || !gor.ok) {
      return bildir('Failed to load data. Please refresh.');
    }

    const kullanici = await me.json();

    $('hello').textContent =
      'Hello, ' + (kullanici.nick?.trim() || kullanici.username);

    // Admin kontrolü
    // is_staff true ise bağlantı görünür, değilse gizli kalır.
    $('adminPanel').classList.toggle('d-none', kullanici.is_staff !== true);

    state.cats = liste(await kat.json());
    state.todos = liste(await gor.json());

    ciz();

    await gunlukOdakYukle();
  }

  yukle();
</script>
