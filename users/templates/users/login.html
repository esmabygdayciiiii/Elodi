
{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Log in · Elodi</title>

  <link rel="icon" type="image/png" href="{% static 'logo.png' %}?v=2">
  <link rel="shortcut icon" type="image/png" href="{% static 'logo.png' %}?v=2">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #1B4A3A;
      --muted: #4D7366;
      --accent: #2B8C69;
      --accent-dark: #1F7A5A;
      --danger: #B3265A;
      --serif: 'Fraunces', Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #D9F2E3 0%, #BCE6D3 45%, #A8DAD6 100%);
      overflow-x: hidden;
    }

    /* BACKGROUND */

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .75;
      pointer-events: none;
      z-index: 0;
    }

    .b1 {
      width: 420px;
      height: 420px;
      background: #7ED9A8;
      top: -120px;
      left: -100px;
    }

    .b2 {
      width: 480px;
      height: 480px;
      background: #5FB7B8;
      bottom: -160px;
      right: -120px;
    }

    .b3 {
      width: 320px;
      height: 320px;
      background: #E6F5B8;
      top: 35%;
      left: 40%;
      opacity: .6;
    }

    /* GLASS CARD */

    .glass {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,.38);
      border: 1px solid rgba(255,255,255,.75);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      backdrop-filter: blur(24px) saturate(140%);
      box-shadow: 0 24px 70px rgba(27,74,58,.18);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass {
        background: rgba(244,252,248,.92);
      }
    }

    /* LEFT SIDE */

    .intro {
      padding: 56px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      animation: float 3.5s ease-in-out infinite;
    }

    .logo span {
      font: 700 2.6rem/1 var(--serif);
    }

    .intro p {
      max-width: 300px;
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .d1 {
      width: 22px;
      height: 22px;
      top: 18%;
      left: 16%;
    }

    .d2 {
      width: 12px;
      height: 12px;
      top: 28%;
      right: 18%;
    }

    .d3 {
      width: 30px;
      height: 30px;
      bottom: 16%;
      right: 22%;
    }

    .d4 {
      width: 14px;
      height: 14px;
      bottom: 24%;
      left: 20%;
    }

    @keyframes float {
      50% {
        transform: translateY(-6px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo img {
        animation: none;
      }
    }

    /* RIGHT SIDE: LOGIN FORM */

    .formside {
      padding: 44px 40px;
    }

    h1 {
      font: 700 1.7rem/1.2 var(--serif);
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      font-size: .92rem;
      margin: 0 0 22px;
    }

    /* INPUTS AND BUTTON */

    .field {
      margin-bottom: 12px;
    }

    .field input[type=text],
    .field input[type=password] {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      font: inherit;
      font-size: .93rem;
      color: var(--ink);
      background: rgba(255,255,255,.7);
      border: 1.5px solid rgba(255,255,255,.95);
      transition: .2s;
    }

    .field input::placeholder {
      color: #7C9A8F;
    }

    .field input:focus {
      outline: 0;
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(43,140,105,.18);
    }

    .field.bad input {
      border-color: var(--danger);
    }

    .pw {
      position: relative;
    }

    .pw input {
      padding-right: 48px !important;
    }

    .pw button {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--muted);
    }

    .pw button:hover {
      background: rgba(43,140,105,.1);
    }

    .err {
      color: var(--danger);
      font-size: .8rem;
      font-weight: 500;
      margin: 5px 4px 0;
    }

    .err:empty {
      display: none;
    }

    .btn-go {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 8px 20px rgba(31,122,90,.3);
      transition: .2s;
    }

    .btn-go:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(31,122,90,.38);
      color: #fff;
    }

    .btn-go:disabled {
      opacity: .65;
      transform: none;
    }

    a.link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    a.link:hover {
      text-decoration: underline;
    }

    .bottom {
      text-align: center;
      margin: 18px 0 0;
      font-size: .88rem;
      color: var(--muted);
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 820px) {
      .glass {
        grid-template-columns: 1fr;
        max-width: 480px;
      }

      .intro {
        padding: 36px 28px 6px;
      }

      .logo img {
        width: 64px;
        height: 64px;
      }

      .logo span {
        font-size: 2.1rem;
      }

      .intro p {
        font-size: .92rem;
        margin-top: 12px;
      }

      .dot {
        display: none;
      }

      .formside {
        padding: 24px 24px 32px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND SHAPES -->

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="glass">

    <!-- LEFT: LOGO AND DESCRIPTION -->

    <section class="intro">

      <span class="dot d1"></span>
      <span class="dot d2"></span>
      <span class="dot d3"></span>
      <span class="dot d4"></span>

      <div class="logo">

        <img src="{% static 'logo.png' %}" alt="Elodi">

        <span>Elodi</span>

      </div>

      <p>
        Keep your tasks calm and organized.
        Elodi is here to make every day a little lighter.
      </p>

    </section>


    <!-- RIGHT: LOGIN FORM -->

    <section class="formside" id="formSide">

      <h1>Welcome back</h1>

      <p class="sub">
        Log in to your account. Your tasks are waiting for you.
      </p>

      <div
        class="alert alert-danger py-2 px-3 small rounded-4 border-0 d-none"
        id="formError"
        role="alert">
      </div>


      <form id="form" novalidate>

        <!-- USERNAME -->

        <div class="field" data-field="username">

          <label class="visually-hidden" for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
          >

          <div class="err"></div>

        </div>


        <!-- PASSWORD -->

        <div class="field" data-field="password">

          <label class="visually-hidden" for="password">
            Password
          </label>

          <div class="pw">

            <input
              id="password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            >

            <button
              type="button"
              id="toggle"
              aria-label="Show password">

              <i class="bi bi-eye"></i>

            </button>

          </div>

          <div class="err"></div>

        </div>


        <button class="btn btn-go" id="submit" type="submit">
          Log in
        </button>

      </form>


      <p class="bottom">
        Don't have an account?
        <a class="link" href="/register/">Sign up</a>
      </p>

    </section>


    <!-- LOGIN SUCCESSFUL -->

    <section class="formside d-none text-center" id="okSide">

      <h1>Login successful</h1>

      <p class="sub">
        Welcome, <strong id="okName"></strong>!
      </p>

    </section>

  </main>


  <script>

    // Redirect destination after login
    const GIRIS_SONRASI = '/app/';

    const $ = id => document.getElementById(id);

    const fields = ['username', 'password'];

    const wrap = f =>
      document.querySelector('[data-field="' + f + '"]');


    // SHOW / HIDE PASSWORD

    $('toggle').addEventListener('click', () => {

      const gizli = $('password').type === 'password';

      $('password').type = gizli ? 'text' : 'password';

      $('toggle').innerHTML = gizli
        ? '<i class="bi bi-eye-slash"></i>'
        : '<i class="bi bi-eye"></i>';

      $('toggle').setAttribute(
        'aria-label',
        gizli ? 'Hide password' : 'Show password'
      );

    });


    // DISPLAY ERRORS

    function hataGoster(f, mesaj) {

      wrap(f).classList.add('bad');

      wrap(f).querySelector('.err').textContent = mesaj;

    }


    function hatalariTemizle() {

      fields.forEach(f => {

        wrap(f).classList.remove('bad');

        wrap(f).querySelector('.err').textContent = '';

      });

      $('formError').classList.add('d-none');

    }


    function genelHata(mesaj) {

      $('formError').textContent = mesaj;

      $('formError').classList.remove('d-none');

    }


    // LOGIN PROCESS

    $('form').addEventListener('submit', async e => {

      e.preventDefault();

      hatalariTemizle();


      // Username and password

      const veri = {

        username: $('username').value.trim().toLowerCase(),

        password: $('password').value

      };


      // Basic validation

      let hata = false;


      if (!veri.username) {

        hataGoster('username', 'Please enter your username.');

        hata = true;

      }


      if (!veri.password) {

        hataGoster('password', 'Please enter your password.');

        hata = true;

      }


      if (hata) {

        const ilkHatalıAlan = fields.find(f =>
          wrap(f).classList.contains('bad')
        );

        return $(ilkHatalıAlan).focus();

      }


      $('submit').disabled = true;


      try {

        const res = await fetch('/api/auth/login/', {

          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify(veri)

        });


        const govde = await res.json().catch(() => ({}));


        if (res.status === 200) {

          // STORE TOKENS

          try {

            localStorage.setItem('elodi_access', govde.access);

            localStorage.setItem('elodi_refresh', govde.refresh);

            localStorage.setItem(
              'elodi_user',
              JSON.stringify(govde.user)
            );

          } catch {}


          // REDIRECT TO HOME PAGE

          if (GIRIS_SONRASI) {

            return location.assign(GIRIS_SONRASI);

          }


          $('okName').textContent =
            (govde.user && (govde.user.nick || govde.user.username)) || '';

          $('formSide').classList.add('d-none');

          $('okSide').classList.remove('d-none');


        } else if (res.status === 401) {

          genelHata('Incorrect username or password.');


        } else if (res.status === 429) {

          genelHata('Too many attempts. Please wait a moment and try again.');


        } else {

          genelHata('Something went wrong on the server. Please try again later.');

        }


      } catch {

        genelHata('Unable to connect to the server. Please check your internet connection.');

      } finally {

        $('submit').disabled = false;

      }

    });

  </script>

</body>
</html>
